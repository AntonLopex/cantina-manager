<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cantina Manager - Xestión de Pedidos</title>
  <meta name="description" content="Aplicación web ultrarrápida para a xestión de pedidos en cantinas e eventos.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍹</text></svg>">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <!-- Header & Navbar -->
  <header class="app-header">
    <div class="brand-logo">
      <div class="brand-icon">🍹</div>
      <h1 class="brand-title">Reencontro Fest</h1>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="pedidos">
        <span>📋</span> Pedidos
      </button>
      <button class="nav-tab" data-tab="resultados">
        <span>📊</span> Resultados
      </button>
      <button class="nav-tab" data-tab="axustes">
        <span>⚙️</span> Axustes
      </button>
    </nav>
  </header>

  <!-- Contido Principal -->
  <main class="main-content">

    <!-- Pestaña 1: Toma de Pedidos -->
    <section id="tab-pedidos" class="tab-pane active">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar consumición por nome (ex. cervexa, auga, bocadillo)...">
      </div>

      <div class="items-grid" id="items-grid">
        <!-- Tarxetas xeradas dinamicamente vía JS -->
      </div>
    </section>

    <!-- Pestaña 2: Resultados (Protexida) -->
    <section id="tab-resultados" class="tab-pane">
      <div id="resultados-content">
        <!-- Datos de ventas xerados vía JS -->
      </div>
    </section>

    <!-- Pestaña 3: Axustes (Protexida) -->
    <section id="tab-axustes" class="tab-pane">
      <div id="axustes-content">
        <!-- Formulario e táboa de catálogo xerados vía JS -->
      </div>
    </section>

  </main>

  <!-- Barra Inferior Fixa (Toma de Pedidos) -->
  <div class="order-bar" id="order-bar">
    <div class="order-bar-info">
      <div class="order-count-chip" id="total-count">0 artigos</div>
      <div class="order-total-price">
        <span class="order-total-label">Total acumulado</span>
        <span class="order-total-val" id="total-price">0,00 €</span>
      </div>
    </div>
    <button class="btn-finalize" id="btn-finalize" disabled>
      <span>Finalizar pedido</span> ➔
    </button>
  </div>

  <!-- Modal de Confirmación de Pedido -->
  <div class="modal-backdrop" id="modal-confirmation">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Resumo do Pedido</h2>
        <button class="modal-close-btn" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div id="modal-order-list" class="modal-order-list"></div>
        <div id="warning-container"></div>
      </div>
      <div class="modal-footer">
        <div class="modal-total-summary">
          <span>Total a cobrar:</span>
          <span id="modal-total-price" style="color: var(--color-primary-dark);">0,00 €</span>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="btn-cancel-modal">Seguir editando</button>
          <button class="btn-confirm" id="btn-confirm-save">Confirmar e gardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Autenticación PIN (Axustes e Resultados) -->
  <div class="modal-backdrop" id="pin-modal">
    <div class="modal-card" style="max-width: 380px;">
      <div class="modal-header">
        <h2 class="modal-title">Sección Protexida</h2>
      </div>
      <div class="modal-body" style="text-align: center;">
        <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 20px;">
          Introduce o contrasinal do responsable para acceder a esta pantalla.
        </p>
        <input type="password" id="pin-input" class="pin-input" placeholder="••••" autocomplete="off">
        <div id="pin-error" style="color: #EF4444; font-size: 0.85rem; margin-bottom: 12px; display: none;">
          Contrasinal incorrecto
        </div>
        <button id="btn-pin-submit" class="btn-pin-submit">Acceder</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
